name: CI

on:
  pull_request:
  push:
    branches: [main]

# A contributor who pushes five times in a row should not queue five full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Turbo runs these across every workspace and caches per package, so a PR
      # that only touches one app does not rebuild the other three.
      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Start Supabase
        run: |
          supabase start
          supabase db reset
        env:
          SUPABASE_DB_PASSWORD: postgres

      - name: Test
        run: npx turbo run test
        env:
          # mongodb-memory-server downloads a real mongod on first run.
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service_role_key
          SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long

      - name: Build
        run: npx turbo run build

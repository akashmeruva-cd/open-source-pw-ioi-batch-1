name: CI

on:
  pull_request:
  push:
    branches: [main]

# A contributor who pushes five times in a row should not queue five full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeLink (Typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turbo runs typecheck across every workspace and caches per package.
      # Packages with "^build" dependencies build first automatically.
      - name: Run TypeLink / TypeScript checks
        run: npx turbo run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turbo runs lint across every workspace and caches per package.
      - name: Lint
        run: npx turbo run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx turbo run test
        env:
          # mongodb-memory-server downloads a real mongod on first run.
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx turbo run build

